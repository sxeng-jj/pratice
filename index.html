<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 오름·해변</title>
    <style>
        :root { --bg:#f4f8f7; --card:#fff; --text:#1f2d2b; --dim:#6b7c79; --line:#dbe6e3; --oreum:#3f8f5b; --beach:#2b8fc9; --pick:#e8505b; }
        * { box-sizing: border-box; }
        body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,"Malgun Gothic",sans-serif; }
        header { padding:36px 16px 24px; text-align:center; background:linear-gradient(135deg,#3f8f5b,#2b8fc9); color:#fff; }
        header h1 { margin:0 0 8px; font-size:30px; }
        header p { margin:0; opacity:.9; }
        main { max-width:1100px; margin:0 auto; padding:16px; }

        .tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0 16px; }
        .tools input { flex:1; min-width:180px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-size:15px; }
        .tools button { padding:9px 16px; border:1px solid var(--line); background:var(--card); border-radius:20px; font-size:14px; cursor:pointer; }
        .tools button.on { background:var(--text); color:#fff; border-color:var(--text); }

        h2 { font-size:18px; margin:22px 0 10px; }
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
        .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:8px; border-top:5px solid var(--line); }
        .card.오름 { border-top-color:var(--oreum); } .card.해변 { border-top-color:var(--beach); }
        .card .top { display:flex; justify-content:space-between; align-items:center; }
        .tag { font-size:12px; padding:2px 8px; border-radius:10px; color:#fff; }
        .tag.오름 { background:var(--oreum); } .tag.해변 { background:var(--beach); }
        .card h3 { margin:0; font-size:18px; }
        .card p { margin:0; color:var(--dim); font-size:14px; line-height:1.5; flex:1; }
        .score { display:flex; align-items:center; gap:8px; font-size:13px; }
        .bar { flex:1; height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
        .bar i { display:block; height:100%; background:linear-gradient(90deg,#fbbf24,#f97316); }
        .pick { border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px; cursor:pointer; font-size:14px; }
        .pick.on { background:var(--pick); color:#fff; border-color:var(--pick); }

        #msg { color:var(--dim); padding:20px 0; text-align:center; }

        /* 카드를 누르면 상세 페이지로 이동 */
        .card[data-go] { cursor:pointer; transition:transform .15s, box-shadow .15s; }
        .card[data-go]:hover { transform:translateY(-3px); box-shadow:0 6px 16px rgba(0,0,0,.1); }

        /* 메인: 인기 10곳 슬라이드 */
        .slider { position:relative; height:min(62vh,460px); min-height:340px; border-radius:16px; overflow:hidden; margin-top:8px; background:#222; }
        .slide { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; gap:10px; padding:40px 8% ; color:#fff; opacity:0; visibility:hidden; transition:opacity .8s, visibility .8s; cursor:pointer; }
        .slide.오름 { background:linear-gradient(135deg,#2f7d4b,#1f4d34); } .slide.해변 { background:linear-gradient(135deg,#2b8fc9,#17517a); }
        .slide.active { opacity:1; visibility:visible; }
        .slide .rank { font-size:14px; letter-spacing:.1em; opacity:.85; }
        .slide h2 { margin:0; font-size:clamp(30px,6vw,52px); }
        .slide .meta { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
        .slide .meta .tag { background:rgba(255,255,255,.25); font-size:13px; }
        .slide .meta b { font-size:22px; color:#fde68a; }
        .slide p { margin:0; max-width:640px; line-height:1.7; opacity:.95; font-size:16px; }
        .slide .more { align-self:flex-start; margin-top:6px; padding:9px 18px; border-radius:20px; border:1px solid rgba(255,255,255,.7); background:transparent; color:#fff; font-size:14px; cursor:pointer; }
        .arrow { position:absolute; top:50%; transform:translateY(-50%); z-index:2; width:40px; height:40px; border-radius:50%; border:0; background:rgba(0,0,0,.35); color:#fff; font-size:20px; cursor:pointer; }
        .arrow.l { left:10px; } .arrow.r { right:10px; }
        .dots { position:absolute; left:0; right:0; bottom:14px; z-index:2; display:flex; justify-content:center; gap:8px; }
        .dots button { width:10px; height:10px; padding:0; border-radius:50%; border:0; background:rgba(255,255,255,.45); cursor:pointer; }
        .dots button.on { background:#fff; transform:scale(1.3); }
        .progress { position:absolute; left:0; bottom:0; height:4px; background:#fde68a; z-index:2; width:0; }
        .progress.run { animation:fill 10s linear forwards; }
        @keyframes fill { from { width:0 } to { width:100% } }
        .homebtns { display:flex; justify-content:center; gap:10px; margin:18px 0 8px; flex-wrap:wrap; }
        .homebtns button { padding:12px 22px; border-radius:24px; border:1px solid var(--line); background:var(--card); font-size:15px; cursor:pointer; }
        .homebtns button.main { background:var(--text); color:#fff; border-color:var(--text); }
        .toplist { color:var(--dim); text-align:center; font-size:14px; margin:8px 0; }

        /* 상세 페이지 */
        .back { padding:8px 14px; border:1px solid var(--line); background:var(--card); border-radius:20px; cursor:pointer; font-size:14px; margin:6px 0 12px; }
        .dcard { background:var(--card); border:1px solid var(--line); border-top:6px solid var(--line); border-radius:12px; padding:20px; }
        .dcard.오름 { border-top-color:var(--oreum); } .dcard.해변 { border-top-color:var(--beach); }
        .dhead { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
        .dhead h2 { margin:0; font-size:28px; }
        .dscore { margin:16px 0; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
        .dscore b { font-size:40px; color:#f97316; }
        .dscore .bar { min-width:140px; height:12px; }
        .dscore small { color:var(--dim); }
        .info { display:grid; grid-template-columns:70px 1fr; gap:10px 12px; margin:0 0 16px; }
        .info dt { color:var(--dim); font-size:14px; }
        .info dd { margin:0; line-height:1.6; }
        .actions { display:flex; gap:8px; flex-wrap:wrap; }
        .actions a, .actions button { padding:9px 14px; border:1px solid var(--line); background:#fff; border-radius:8px; font-size:14px; cursor:pointer; color:var(--text); text-decoration:none; }
        .actions .pick.on { background:var(--pick); color:#fff; border-color:var(--pick); }
        .minis { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; }
        .mini { display:block; padding:10px 12px; background:var(--card); border:1px solid var(--line); border-radius:10px; text-decoration:none; color:var(--text); }
        .mini:hover { border-color:var(--text); }
        .mini b { display:block; }
        .mini span { font-size:13px; color:var(--dim); }
        .pn { display:flex; justify-content:space-between; gap:10px; margin:20px 0; flex-wrap:wrap; }
        .pn .mini { flex:1; min-width:200px; }
    </style>
</head>

    <header>
        <h1>제주 오름 · 해변</h1>

    <main>
        <div id="home">
            <div class="slider" id="slider">

                <button class="arrow l" id="sPrev" aria-label="이전">‹</button>
                <button class="arrow r" id="sNext" aria-label="다음">›</button>
                <div class="dots" id="dots"></div>
                <div class="progress" id="progress"></div>
            </div>
            <p class="toplist">점수가 가장 높은 인기 10곳 · 10초마다 자동으로 넘어갑니다 (마우스를 올리면 멈춰요)</p>
            <div class="homebtns">
                <button class="main" id="toList">전체 목록 보기</button>
            </div>
        </div>
        <div id="detail" hidden></div>
        <div id="list" hidden>
        <button class="back" id="toHome">← 메인으로</button>
        <h2>전체 목록 <span id="count" style="font-weight:400;color:var(--dim);font-size:14px"></span></h2>
        <div class="tools">
            <input id="search" type="search" placeholder="이름으로 검색 (예: 새별, 해수욕장)">
            <span id="cats"></span>
        </div>
        <div class="grid" id="grid"></div>
        <div id="msg"></div>
        </div>
    </main>

    { "name": "신양섭지해수욕장", "category": "해변", "description": "서귀포시 성산 지역의 해변. 섭지코지와 가깝고 성산일출봉이 보이는 해변", "score": 79, "selected": false, "source": "" },
    { "name": "광치기해변", "category": "해변", "description": "서귀포시 성산 지역의 해변. 성산일출봉 앞 검은 현무암과 해초 풍경, 일출 명소", "score": 89, "selected": true, "source": "" },
    { "name": "중문색달해수욕장", "category": "해변", "description": "서귀포시 중문 지역의 해변. 파도가 높아 서핑 명소로 알려져 있다", "score": 85, "selected": false, "source": "" },
    { "name": "사계해변", "category": "해변", "description": "서귀포시 안덕 지역의 해변. 산방산과 형제섬을 바라보는 풍경이 좋다", "score": 88, "selected": false, "source": "" },
    { "name": "화순금모래해변", "category": "해변", "description": "서귀포시 안덕 지역의 해변. 금빛 모래와 산방산 쪽 전망, 용천수가 있다", "score": 81, "selected": false, "source": "" },
    { "name": "하모해변", "category": "해변", "description": "서귀포시 대정 지역의 해변. 송악산과 가까운 한적한 해변이다", "score": 70, "selected": false, "source": "" },
    { "name": "서빈백사", "category": "해변", "description": "제주시 우도의 해변. 홍조단괴로 이루어진 하얀 해변과 에메랄드빛 바다", "score": 94, "selected": true, "source": "" },
    { "name": "하고수동해수욕장", "category": "해변", "description": "제주시 우도의 해변. 넓은 백사장과 맑은 바다로 우도에서 해수욕하기 좋다", "score": 86, "selected": false, "source": "" },
    { "name": "검멀레해변", "category": "해변", "description": "제주시 우도의 해변. 검은 모래와 해식동굴이 있는 독특한 해변", "score": 83, "selected": false, "source": "" }
  ]
}
    </script>

    <script>
        let items = []          // JSON 의 items 배열
        let category = "전체"   // 선택된 category 버튼
        const WISH = "담은 곳"  // category 가 아니라 selected 가 true 인 항목을 모아 보는 특별 버튼
        const $ = (id) => document.getElementById(id)

        // 보기 좋게 정리: 검색어와 category 로 거른 뒤 score 높은 순으로 정렬
        const visible = () => {
            const q = $("search").value.trim()
            return items
                .filter((it) => category === "전체" || (category === WISH ? it.selected : it.category === category))
                .filter((it) => it.name.includes(q))
                .sort((a, b) => b.score - a.score)
        }

        const render = () => {
            const list = visible()
            $("count").textContent = `(${list.length}곳)`
            $("msg").textContent = list.length ? ""
                : category === WISH && !$("search").value.trim() ? "아직 담은 곳이 없습니다. 전체 목록에서 ♡ 담기를 눌러 보세요."
                : "조건에 맞는 장소가 없습니다."
            $("grid").innerHTML = list.map((it) => `
                <article class="card ${it.category}" data-go="${it.name}">
                    <div class="top"><h3>${it.name}</h3><span class="tag ${it.category}">${it.category}</span></div>
                    <p>${it.description}</p>
                    <div class="score"><span>${it.score}점</span><span class="bar"><i style="width:${it.score}%"></i></span></div>
                    <button class="pick ${it.selected ? "on" : ""}" data-name="${it.name}">${it.selected ? "❤ 가 보고 싶은 곳" : "♡ 담기"}</button>
                </article>`).join("")
        }

        const makeButtons = () => {
            const names = ["전체", ...new Set(items.map((it) => it.category)), WISH]
            const label = (n) => n === WISH ? `❤ 담은 곳 (${items.filter((it) => it.selected).length})` : n
            $("cats").innerHTML = names.map((n) => `<button data-c="${n}" class="${n === category ? "on" : ""}">${label(n)}</button>`).join(" ")
        }

        $("cats").onclick = (e) => {
            if (!e.target.dataset.c) return
            category = e.target.dataset.c
            makeButtons()
            render()
        }
        $("search").oninput = render
        // 카드의 담기 버튼: selected 값을 뒤집는다 (이 화면에서만 바뀌고 JSON 파일은 그대로)
        const toggle = (name) => {
            const it = items.find((x) => x.name === name)
            it.selected = !it.selected
            makeButtons()   // "❤ 담은 곳 (n)" 의 개수 갱신
            render()
            route()
        }
        $("grid").onclick = (e) => {
            const pick = e.target.closest(".pick")
            if (pick) return toggle(pick.dataset.name)   // 담기 버튼은 이동하지 않고 담기만
            const card = e.target.closest("[data-go]")
            if (card) go(card.dataset.go)               // 카드의 다른 곳을 누르면 상세 페이지로
        }

        // ───── 상세 페이지 ─────
        // 주소 뒤의 #/이름 으로 어떤 항목인지 구분한다 (예: oreum_beach.html#/새별오름). 뒤로 가기도 그대로 동작한다.
        const go = (name) => { location.hash = "#/" + encodeURIComponent(name) }
        const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]))
        const byScore = (list) => [...list].sort((a, b) => b.score - a.score)

        // description 은 "제주시 애월 지역의 오름. 특징…" 꼴이라서 지역과 볼거리를 잘라 낸다
        const areaOf = (it) => ((it.description.match(/^(.+?)(?: 지역)?의 /) || [])[1] || "")
        const featureOf = (it) => it.description.split(". ").slice(1).join(". ")

        const mini = (it) => `<a class="mini" href="#/${encodeURIComponent(it.name)}"><b>${esc(it.name)}</b><span>${it.category} · ${it.score}점</span></a>`

        const showDetail = (it) => {
            const all = byScore(items)
            const sameCat = byScore(items.filter((x) => x.category === it.category))
            const rankAll = all.indexOf(it) + 1
            const rankCat = sameCat.indexOf(it) + 1
            const area = areaOf(it)
            const sameArea = area ? all.filter((x) => x !== it && areaOf(x) === area).slice(0, 6) : []
            const similar = sameCat.filter((x) => x !== it).slice(0, 4)
            const q = encodeURIComponent(it.name + " 제주")

            $("detail").innerHTML = `
                <button class="back" id="back">← 목록으로</button>
                <article class="dcard ${it.category}">
                    <div class="dhead"><span class="tag ${it.category}">${it.category}</span><h2>${esc(it.name)}</h2></div>
                    <div class="dscore"><b>${it.score}</b><small>점</small><span class="bar"><i style="width:${it.score}%"></i></span>
                        <small>전체 ${all.length}곳 중 ${rankAll}위 · ${it.category} ${sameCat.length}곳 중 ${rankCat}위</small></div>
                    <dl class="info">
                        <dt>지역</dt><dd>${esc(area || "정보 없음")}</dd>
                        <dt>분류</dt><dd>${it.category}</dd>
                        <dt>소개</dt><dd>${esc(it.description)}</dd>
                        ${featureOf(it) ? `<dt>볼거리</dt><dd>${esc(featureOf(it))}</dd>` : ""}
                        <dt>출처</dt><dd>${it.source ? esc(it.source) : "아직 기록되지 않았습니다"}</dd>
                    </dl>
                    <div class="actions">
                        <button class="pick ${it.selected ? "on" : ""}" data-name="${esc(it.name)}">${it.selected ? "❤ 가 보고 싶은 곳" : "♡ 담기"}</button>
                        <a href="https://map.naver.com/p/search/${q}" target="_blank" rel="noopener">네이버 지도에서 찾기</a>
                        <a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">구글 지도에서 찾기</a>
                    </div>
                </article>
                ${sameArea.length ? `<h2>같은 지역의 다른 곳 (${esc(area)})</h2><div class="minis">${sameArea.map(mini).join("")}</div>` : ""}
                <h2>같은 ${it.category} 중 추천</h2><div class="minis">${similar.map(mini).join("")}</div>
                <div class="pn">
                    ${rankAll > 1 ? mini(all[rankAll - 2]).replace("<b>", "<b>◀ 앞 순위 · ") : "<span></span>"}
                    ${rankAll < all.length ? mini(all[rankAll]).replace("<b>", "<b>다음 순위 ▶ ") : "<span></span>"}
                </div>`
            $("back").onclick = () => { location.hash = prevView }   // 상세로 오기 전 화면(메인 또는 목록)으로
            $("detail").querySelector(".pick").onclick = (e) => toggle(e.currentTarget.dataset.name)
        }

        // ───── 메인: 인기 10곳 슬라이드 (10초 간격) ─────
        const INTERVAL = 10000
        let top10 = [], cur = 0, timer = null

        const buildSlides = () => {
            top10 = byScore(items).slice(0, 10)
            $("slides").innerHTML = top10.map((it, i) => `
                <div class="slide ${it.category}" data-go="${esc(it.name)}">
                    <span class="rank">인기 ${i + 1}위</span>
                    <h2>${esc(it.name)}</h2>
                    <div class="meta"><span class="tag">${it.category}</span><b>${it.score}점</b><small>${esc(areaOf(it))}</small></div>
                    <p>${esc(it.description)}</p>
                    <button class="more">자세히 보기 →</button>
                </div>`).join("")
            $("dots").innerHTML = top10.map((_, i) => `<button data-i="${i}" aria-label="${i + 1}번 슬라이드"></button>`).join("")
        }

        const show = (i) => {
            cur = (i + top10.length) % top10.length
            document.querySelectorAll(".slide").forEach((s, k) => s.classList.toggle("active", k === cur))
            document.querySelectorAll("#dots button").forEach((d, k) => d.classList.toggle("on", k === cur))
            const p = $("progress")           // 진행 막대를 처음부터 다시 채운다
            p.classList.remove("run"); void p.offsetWidth; p.classList.add("run")
            clearTimeout(timer)
            timer = setTimeout(() => show(cur + 1), INTERVAL)
        }
        const stopSlider = () => { clearTimeout(timer); $("progress").classList.remove("run") }

        $("sPrev").onclick = () => show(cur - 1)
        $("sNext").onclick = () => show(cur + 1)
        $("dots").onclick = (e) => { if (e.target.dataset.i) show(Number(e.target.dataset.i)) }
        $("slides").onclick = (e) => { const s = e.target.closest("[data-go]"); if (s) go(s.dataset.go) }
        $("slider").onmouseenter = stopSlider                       // 마우스를 올리면 멈춤
        $("slider").onmouseleave = () => { if (!$("home").hidden) show(cur) }
        $("toList").onclick = () => { location.hash = "#/list" }
        $("toHome").onclick = () => { location.hash = "" }

        // 주소를 보고 메인 · 목록 · 상세 중 하나를 보여 준다
        //   (없음) → 메인 슬라이드,  #/list → 전체 목록,  #/이름 → 그 항목의 상세
        let prevView = ""
        const route = () => {
            const m = location.hash.match(/^#\/(.+)$/)
            const name = m && decodeURIComponent(m[1])
            const it = name && name !== "list" && items.find((x) => x.name === name)
            const view = it ? "detail" : name === "list" ? "list" : "home"
            $("home").hidden = view !== "home"
            $("list").hidden = view !== "list"
            $("detail").hidden = view !== "detail"
            if (view !== "detail") prevView = view === "list" ? "#/list" : ""
            if (view === "detail") showDetail(it)
            if (view === "home") show(cur); else stopSlider()
        }
        window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0) })

        const start = (d) => {
            items = d.items
            $("sub").textContent = `${d.region} · ${d.topic} ${items.length}곳을 점수순으로 만나 보세요`
            makeButtons()
            render()
            buildSlides()
            route()
        }

        // 서버로 열면 JSON 파일을 읽고, 파일을 더블클릭해 열어 file:// 로 막히면 아래 <script id="backup"> 의 복사본을 쓴다
        fetch("jeju_oreum_beach.json")
            .then((r) => r.json())
            .then(start)
            .catch(() => start(JSON.parse($("backup").textContent)))
    </script>
</body>
</html>
